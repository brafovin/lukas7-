<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUNEXUND</title>
  <meta name="description" content="LUNEXUND – Streetwear in Schwarz & Weiß. Folge uns auf TikTok und Instagram.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --black: #0a0a0a; --white: #f5f5f2; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }
    h1 {
      font-family: "Permanent Marker", cursive;
      font-size: clamp(3rem, 16vw, 8rem);
      letter-spacing: 0.04em;
      transform: rotate(-3deg);
      text-shadow: 4px 4px 0 #444;
    }
    .tag {
      font-family: "Permanent Marker", cursive;
      font-size: 1.25rem;
      margin: 12px 0 40px;
      opacity: 0.85;
    }
    .links { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
    a.btn {
      display: block;
      padding: 16px;
      border: 2px solid var(--white);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background .15s, color .15s;
    }
    a.btn:hover, a.btn:focus-visible { background: var(--white); color: var(--black); outline: none; }
    a.btn.solid { background: var(--white); color: var(--black); }
    a.btn.solid:hover, a.btn.solid:focus-visible { background: transparent; color: var(--white); }
    .range { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; margin-bottom: 40px; }
    .range li { font-family: "Permanent Marker", cursive; padding: 4px 10px; border: 1px solid #444; transform: rotate(-1deg); }
    .range li:nth-child(even) { transform: rotate(1.5deg); }
    footer { margin-top: 48px; font-size: .8rem; opacity: .5; }
  </style>
</head>
<body>
  <h1>LUNEXUND</h1>
  <p class="tag">streetwear · schwarz &amp; weiß</p>
  <ul class="range">
    <li>Winterjacke</li><li>T-Shirts</li><li>Pullover</li>
    <li>Hosen</li><li>Jogginganzug</li><li>Kurze Hosen</li>
  </ul>
  <nav class="links">
    <!-- TODO: echte Profil-Links eintragen -->
    <a class="btn solid" href="https://www.tiktok.com/@lunexund">TikTok</a>
    <a class="btn" href="https://www.instagram.com/lunexund">Instagram</a>
  </nav>
  <footer>© 2026 LUNEXUND</footer>
</body>
</html>
